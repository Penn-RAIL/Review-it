[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "review-it"
version = "0.1.0"
description = "Local manuscript reviewer powered by Ollama"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Ebubechukwu D Enwerem", email = "ebube198@gmail.com" },
  { name = "Satvik Tripathi", email = "satvikt@upenn.edu" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "ollama",
  "local-llm",
  "manuscript",
  "peer-review",
  "academic-writing",
  "docx",
  "fastapi"
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "python-docx>=1.1.2",
  "pypdf>=5.0.0",
  "psutil>=6.0.0"
]

[project.scripts]
review-it = "review_it.cli:main"

[tool.setuptools.packages.find]
include = ["review_it*"]

[tool.setuptools.package-data]
review_it = ["static/**/*", "review_prompt_source.js"]
